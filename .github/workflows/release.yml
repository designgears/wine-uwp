# Builds the wine-uwp runtime (packaging/build-dist.sh) and, for a tag, publishes it as a release:
#
#   git tag v2026.11.12 && git push origin v2026.11.12
#
# The release gets wine-uwp-x86_64.tar.xz (the tree build-dist.sh makes, as wine-uwp/) and its .sha256, so
# https://github.com/OWNER/wine-uwp/releases/latest/download/wine-uwp-x86_64.tar.xz is always the newest one.
# Run by hand (Actions > Release > Run workflow) or for a pull request that changes the build, it only builds and
# keeps the tarball as a workflow artifact.
#
# Wine is built as README.md says: the Wine release in WINE_VERSION, wine/'s files (wine/FILES) copied over it,
# autoreconf, --enable-archs=x86_64. Nothing Microsoft's goes in; the setup harvests that on the user's machine.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/build-dist.sh'
      - 'wine/FILES'

# read-only for everything; only the publish job, which runs only for a tag, may write
permissions:
  contents: read

env:
  WINE_VERSION: '11.20'
  # wine-11.20.tar.xz; checked to be identical to Wine's wine-11.20 commit (7298a818). Change it with WINE_VERSION.
  WINE_SHA256: eac8ca448f9c0087f963026b4dc276d1e2b7fbb64056edc093e59bbb7e56fe28

jobs:
  build:
    # the result needs glibc 2.38 (Ubuntu 24.04, Debian 13, Fedora 39, Arch and newer); its mingw-w64 GCC 13 builds
    # Wine 11 (g++ too: without a PE C++17 compiler icu.dll and dmsynth.dll are left out)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf bison flex gettext gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 ccache xz-utils \
            libasound2-dev libpulse-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libgnutls28-dev \
            libgl-dev libegl-dev libvulkan-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbregistry-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxxf86vm-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libavcodec-dev libavformat-dev libavutil-dev \
            libudev-dev libusb-1.0-0-dev libsdl2-dev libpcap-dev libpcsclite-dev libkrb5-dev libunwind-dev \
            libv4l-dev libcups2-dev

      - name: Restore the compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.WINE_VERSION }}-${{ github.sha }}
          restore-keys: ccache-${{ env.WINE_VERSION }}-

      - name: Wine source with wine-uwp's files
        run: |
          major=${WINE_VERSION%%.*}
          curl -fsSL -o wine.tar.xz "https://dl.winehq.org/wine/source/${major}.x/wine-${WINE_VERSION}.tar.xz"
          echo "$WINE_SHA256  wine.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wine-src"
          tar -xf wine.tar.xz -C "$RUNNER_TEMP/wine-src" --strip-components=1
          rm wine.tar.xz
          # exactly the files listed in wine/FILES (not wine/README.md, BASE.txt or FILES itself)
          grep -v '^\s*#' wine/FILES | grep -v '^\s*$' | while read -r f; do
            mkdir -p "$RUNNER_TEMP/wine-src/$(dirname "$f")"
            cp -f "wine/$f" "$RUNNER_TEMP/wine-src/$f"
          done
          cd "$RUNNER_TEMP/wine-src" && autoreconf -f

      - name: Build Wine
        run: |
          export CCACHE_DIR=~/.cache/ccache CCACHE_MAXSIZE=2G
          mkdir -p "$RUNNER_TEMP/wine-build" && cd "$RUNNER_TEMP/wine-build"
          "$RUNNER_TEMP/wine-src/configure" --enable-archs=x86_64 \
            CC="ccache gcc" CXX="ccache g++" x86_64_CC="ccache x86_64-w64-mingw32-gcc" \
            x86_64_CXX="ccache x86_64-w64-mingw32-g++" > configure.out
          tail -n 30 configure.out
          make -j"$(nproc)" > make.out 2>&1 || { tail -n 80 make.out; exit 1; }
          ccache -s

      - name: Package
        run: |
          WINE_BUILD="$RUNNER_TEMP/wine-build" packaging/build-dist.sh "$RUNNER_TEMP/dist/wine-uwp"
          cd "$RUNNER_TEMP/dist"
          tar --owner=0 --group=0 --numeric-owner -cf - wine-uwp | xz -T0 -9 > wine-uwp-x86_64.tar.xz
          sha256sum wine-uwp-x86_64.tar.xz > wine-uwp-x86_64.tar.xz.sha256
          cat wine-uwp-x86_64.tar.xz.sha256
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > commit.txt
          echo "glibc needed: $(objdump -T wine-uwp/bin/wine wine-uwp/lib/wine/x86_64-unix/*.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"

      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-uwp-x86_64
          path: |
            ${{ runner.temp }}/dist/wine-uwp-x86_64.tar.xz
            ${{ runner.temp }}/dist/wine-uwp-x86_64.tar.xz.sha256
            ${{ runner.temp }}/dist/commit.txt
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wine-uwp-x86_64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c wine-uwp-x86_64.tar.xz.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "wine-uwp $GITHUB_REF_NAME" \
            --notes "wine-uwp runtime built from $(cat commit.txt) (Wine $WINE_VERSION + this repository's changes), x86_64 Linux, 64-bit Windows programs only (no WoW64: 32-bit helpers such as Easy Anti-Cheat's EOS bootstrapper do not run). Unpack with \`tar -xf wine-uwp-x86_64.tar.xz -C ~/.local/opt\`, then see README.md (\"Using it\"). No Microsoft files are included." \
            wine-uwp-x86_64.tar.xz wine-uwp-x86_64.tar.xz.sha256
