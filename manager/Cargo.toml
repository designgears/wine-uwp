[package]
name = "wine-uwp-manager"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Library, settings, installs, logs and accounts for apps under wine-uwp"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
