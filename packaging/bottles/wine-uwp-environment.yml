# Bottles environment recipe for wine-uwp bottles (bottles-cli new --environment custom --custom-environment ...).
# Everything that swaps Wine's Direct3D or DXGI is off: wine-uwp's composition (dcomp, dxgi) is Wine's own, and
# DXVK or VKD3D in the bottle would replace it. The other switches are Bottles' defaults for an application.
Parameters:
  dxvk: false
  dxvk_nvapi: false
  vkd3d: false
  d7vk: false
  latencyflex: false
  mangohud: false
  gamemode: false
  gamescope: false
  vkbasalt: false
  fsr: false
  sandbox: false
  versioning_automatic: false
Installed_Dependencies: []
